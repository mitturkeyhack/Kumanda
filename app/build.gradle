plugins {
    id 'com.android.application'
}

def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.mitturkeyhack.kumanda'
    compileSdk 35

    defaultConfig {
        applicationId "com.mitturkeyhack.kumanda"
        minSdk 26
        // 28: Wi-Fi ve Bluetooth'u uygulamadan açıp kapatabilmek için (daha yenisinde Android izin vermiyor)
        targetSdk 28
        versionCode runNo
        versionName "1.0." + runNo
    }

    signingConfigs {
        release {
            storeFile file("release.jks")
            storePassword "kumanda2026"
            keyAlias "kumanda"
            keyPassword "kumanda2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
